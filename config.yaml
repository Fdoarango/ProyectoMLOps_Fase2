project:
  name: "mibici_anomaly_detection"
  pca_components: 2

data:
  raw_dir: "data/raw/"
  processed_dir: "data/processed/"
  target_column: "es_anomalo"
  datetime_column: "Inicio_Del_Viaje"
  id_columns: ["Viaje_Id", "Usuario_Id", "Origen_Id", "Destino_Id"]
  drop_columns: ["id", "latitude", "longitude", "dpcapacity"]
  numeric_features: ["duracion_minutos", "distancia_km", "edad_usuario"]
  categorical_features: ["Genero", "dia_semana"]

temporal_validation:
  train_window_months: 6
  test_window_months: 1
  step_months: 1

model:
  random_state: 42
  pca_components: 0.95
  n_estimators_grid: [50, 100, 300, 500]
  contamination_grid: ["auto", 0.01, 0.05, 0.1]


tuning:
  n_estimators_list: [50, 100, 300, 500]
  contamination_list: ['auto', 0.01, 0.05, 0.10]